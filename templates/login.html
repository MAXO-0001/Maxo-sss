<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MAXO — ورود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="scanlines" aria-hidden="true"></div>
  <main class="login-card">
    <div class="login-mark" id="loginMark">MAXO</div>
    <p class="login-sub">پنل کنترل سلف — ورود محدود به مدیر</p>

    <form id="loginForm" autocomplete="off">
      <label class="field">
        <span>نام کاربری</span>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>رمز عبور</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-solid btn-wide">ورود</button>
      <p id="loginError" class="login-error" hidden>نام کاربری یا رمز عبور اشتباه است.</p>
    </form>

    <div class="access-granted" id="accessGranted" hidden>ACCESS GRANTED</div>
  </main>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginError');
  err.hidden = true;
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const form = document.getElementById('loginForm');
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    if (res.ok) {
      form.style.display = 'none';
      const flag = document.getElementById('accessGranted');
      flag.hidden = false;
      setTimeout(() => { window.location.href = '/'; }, 650);
    } else {
      err.hidden = false;
      btn.disabled = false;
    }
  } catch (e2) {
    err.hidden = false;
    btn.disabled = false;
  }
});

// subtle periodic glitch on the wordmark, matches dashboard brand
setInterval(() => {
  const mark = document.getElementById('loginMark');
  mark.classList.add('glitch');
  setTimeout(() => mark.classList.remove('glitch'), 220);
}, 5000);
</script>
</body>
</html>
